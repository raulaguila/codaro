<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-label="Primeiro acesso"><title>Primeiro acesso · maquete de UI</title><g font-family="DejaVu Sans Mono,monospace"><rect x="0" y="0" width="1120" height="760" fill="#111821" rx="0" opacity="1" stroke="none"/><rect x="0" y="0" width="1120" height="32" fill="#141d28" rx="0" opacity="1" stroke="none"/><text x="26" y="22" fill="#8392a6" font-size="10" font-weight="400" text-anchor="start">●  ●  ●</text><text x="560.0" y="22" fill="#8392a6" font-size="11" font-weight="400" text-anchor="middle">Codaro · proposta navegável</text><text x="1096" y="22" fill="#8392a6" font-size="10" font-weight="400" text-anchor="end">protótipo</text><text x="30" y="72" fill="#83d6d7" font-size="23" font-weight="400" text-anchor="start">◈</text><text x="60" y="72" fill="#dfe6ef" font-size="18" font-weight="600" text-anchor="start">Codaro</text><text x="150" y="72" fill="#94a3b6" font-size="15" font-weight="400" text-anchor="start">codaro</text><text x="960" y="70" fill="#94a3b6" font-size="12" font-weight="400" text-anchor="end">Conectar modelo</text><rect x="980" y="48" width="110" height="32" fill="#1d2b38" rx="3" opacity="1" stroke="none"/><text x="993" y="69" fill="#dfe6ef" font-size="12" font-weight="400" text-anchor="start">Executar ▾</text><rect x="30" y="98" width="1060" height="1" fill="#223142" rx="0" opacity="1" stroke="none"/><defs><clipPath id="transcript"><rect x="0" y="99" width="1120" height="511"/></clipPath></defs><g clip-path="url(#transcript)"><text x="34" y="209" fill="#dfe6ef" font-size="21" font-weight="400" text-anchor="start">Vamos conectar seu primeiro modelo.</text><text x="34" y="246" fill="#94a3b6" font-size="14" font-weight="400" text-anchor="start">Use sua própria chave ou um modelo local.</text><rect x="34" y="284" width="156.9" height="32" fill="#83d6d7" rx="3" opacity="1" stroke="none"/><text x="47" y="305" fill="#102024" font-size="12" font-weight="600" text-anchor="start">Conectar provedor</text><text x="34" y="345" fill="#8392a6" font-size="12" font-weight="400" text-anchor="start">A chave é configurada fora da conversa.</text></g><rect x="30" y="620" width="1060" height="1" fill="#4b858c" rx="0" opacity="1" stroke="none"/><text x="33" y="652" fill="#83d6d7" font-size="20" font-weight="400" text-anchor="start">›</text><text x="58" y="651" fill="#8392a6" font-size="14" font-weight="400" text-anchor="start">Pergunte ou peça uma mudança…</text><text x="30" y="709" fill="#94a3b6" font-size="11" font-weight="400" text-anchor="start">Selecione um provedor</text><text x="30" y="740" fill="#8392a6" font-size="10" font-weight="400" text-anchor="start">Enter enviar · / comandos · Alt+Enter nova linha</text><text x="1090" y="740" fill="#8392a6" font-size="10" font-weight="400" text-anchor="end">Ctrl+P menu</text></g></svg>