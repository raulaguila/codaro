<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-label="Conversa com várias mensagens"><title>Conversa com várias mensagens · maquete de UI</title><g font-family="DejaVu Sans Mono,monospace"><rect x="0" y="0" width="1120" height="760" fill="#111821" rx="0" opacity="1" stroke="none"/><rect x="0" y="0" width="1120" height="32" fill="#141d28" rx="0" opacity="1" stroke="none"/><text x="26" y="22" fill="#8392a6" font-size="10" font-weight="400" text-anchor="start">●  ●  ●</text><text x="560.0" y="22" fill="#8392a6" font-size="11" font-weight="400" text-anchor="middle">Codaro · proposta navegável</text><text x="1096" y="22" fill="#8392a6" font-size="10" font-weight="400" text-anchor="end">protótipo</text><text x="30" y="72" fill="#83d6d7" font-size="23" font-weight="400" text-anchor="start">◈</text><text x="60" y="72" fill="#dfe6ef" font-size="18" font-weight="600" text-anchor="start">Codaro</text><text x="150" y="72" fill="#94a3b6" font-size="15" font-weight="400" text-anchor="start">codaro</text><text x="960" y="70" fill="#94a3b6" font-size="12" font-weight="400" text-anchor="end">qwen3.8:27b</text><rect x="980" y="48" width="110" height="32" fill="#1d2b38" rx="3" opacity="1" stroke="none"/><text x="993" y="69" fill="#dfe6ef" font-size="12" font-weight="400" text-anchor="start">Executar ▾</text><rect x="30" y="98" width="1060" height="1" fill="#223142" rx="0" opacity="1" stroke="none"/><defs><clipPath id="transcript"><rect x="0" y="99" width="1120" height="511"/></clipPath></defs><g clip-path="url(#transcript)"><rect x="30" y="114" width="1060" height="54" fill="#17212d" rx="2" opacity="0.6" stroke="none"/><rect x="30" y="114" width="2" height="54" fill="#2a394b" rx="0" opacity="1" stroke="none"/><text x="43" y="134" fill="#94a3b6" font-size="10" font-weight="400" text-anchor="start">Você</text><text x="43" y="157" fill="#dfe6ef" font-size="15" font-weight="400" text-anchor="start">Como funciona a autenticação?</text><text x="34" y="208" fill="#94a3b6" font-size="11" font-weight="400" text-anchor="start">3 ações · 2 arquivos consultados</text><text x="34" y="249" fill="#83d6d7" font-size="15" font-weight="600" text-anchor="start">Codaro</text><text x="34" y="283" fill="#dfe6ef" font-size="14" font-weight="400" text-anchor="start">O fluxo começa em src/auth.py. A função can_edit confere as permissões antes de liberar uma edição.</text><text x="34" y="319" fill="#dfe6ef" font-size="14" font-weight="400" text-anchor="start">Falta tratar o caso de usuário ausente antes de consultar is_admin.</text><rect x="30" y="377" width="1060" height="1" fill="#2a394b" rx="0" opacity="1" stroke="none"/><rect x="30" y="392" width="1060" height="54" fill="#17212d" rx="2" opacity="0.6" stroke="none"/><rect x="30" y="392" width="2" height="54" fill="#2a394b" rx="0" opacity="1" stroke="none"/><text x="43" y="412" fill="#94a3b6" font-size="10" font-weight="400" text-anchor="start">Você</text><text x="43" y="435" fill="#dfe6ef" font-size="15" font-weight="400" text-anchor="start">Corrija esse caso mantendo o contrato atual.</text><text x="34" y="482" fill="#94a3b6" font-size="11" font-weight="400" text-anchor="start">4 ações · implementação e testes</text><text x="34" y="515" fill="#83d6d7" font-size="15" font-weight="600" text-anchor="start">Codaro</text><text x="34" y="549" fill="#dfe6ef" font-size="14" font-weight="400" text-anchor="start">Adicionei a verificação de usuário ausente e mantive a assinatura da função.</text><text x="34" y="596" fill="#8bc6a4" font-size="12" font-weight="400" text-anchor="start">✓ 24 testes passaram · 2 arquivos alterados</text></g><rect x="30" y="620" width="1060" height="1" fill="#4b858c" rx="0" opacity="1" stroke="none"/><text x="33" y="652" fill="#83d6d7" font-size="20" font-weight="400" text-anchor="start">›</text><text x="58" y="651" fill="#8392a6" font-size="14" font-weight="400" text-anchor="start">Pergunte ou peça uma mudança…</text><text x="30" y="709" fill="#94a3b6" font-size="11" font-weight="400" text-anchor="start">Pronto</text><text x="1090" y="709" fill="#8392a6" font-size="11" font-weight="400" text-anchor="end">Contexto ≈16k/122k · 13%</text><text x="30" y="740" fill="#8392a6" font-size="10" font-weight="400" text-anchor="start">Enter enviar · / comandos · Alt+Enter nova linha</text><text x="1090" y="740" fill="#8392a6" font-size="10" font-weight="400" text-anchor="end">Ctrl+P menu</text></g></svg>