name: release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  quality:
    uses: ./.github/workflows/ci.yml
  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build twine
      - name: Validate tag and package version
        shell: python
        run: |
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          assert '__version__ = "' + version + '"' in Path('src/codaro/__init__.py').read_text()
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Generate checksums
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          paths = sorted(Path('dist').iterdir())
          Path('dist/SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in paths))
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/
  verify:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ripgrep
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - name: Install wheel
        shell: python
        run: |
          import subprocess, sys
          from pathlib import Path
          subprocess.run([sys.executable, '-m', 'pip', 'install', str(next(Path('dist').glob('*.whl')))], check=True)
      - name: Test installed package outside checkout
        shell: python
        run: |
          import os, shutil, subprocess, sys
          from pathlib import Path
          script = Path(os.environ['RUNNER_TEMP']) / 'codaro-package-smoke.py'
          shutil.copyfile('scripts/package_smoke.py', script)
          subprocess.run([sys.executable, str(script)], cwd=script.parent, check=True)
  publish:
    if: github.ref_type == 'tag'
    needs: [quality, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --prerelease
