name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/setup-ripgrep
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
        if: matrix.python-version != '3.12'
      - name: Tests and coverage
        if: matrix.python-version == '3.12'
        run: pytest -q --cov --cov-report=term --cov-report=xml:.codaro/quality/coverage.xml --cov-report=html:.codaro/quality/coverage
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.12'
        with:
          name: coverage
          path: .codaro/quality/
          retention-days: 14
  retrieval-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-ripgrep
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e '.[dev]'
      - name: Evaluate committed retrieval cases (no model calls)
        run: codaro evaluate evaluations/cases.json --output .codaro/quality/retrieval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retrieval-quality
          path: .codaro/quality/retrieval.json
          retention-days: 14
  installed-package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ripgrep
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Install wheel and validate outside checkout
        shell: python
        run: |
          import os, shutil, subprocess, sys
          from pathlib import Path
          wheel = next(Path('dist').glob('*.whl'))
          subprocess.run([sys.executable, '-m', 'pip', 'install', str(wheel)], check=True)
          script = Path(os.environ['RUNNER_TEMP']) / 'codaro-package-smoke.py'
          shutil.copyfile('scripts/package_smoke.py', script)
          subprocess.run([sys.executable, str(script)], cwd=script.parent, check=True)
