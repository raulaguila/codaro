name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: ./.github/actions/setup-ripgrep
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
  installed-package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-ripgrep
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Install wheel and validate outside checkout
        shell: python
        run: |
          import os, shutil, subprocess, sys
          from pathlib import Path
          wheel = next(Path('dist').glob('*.whl'))
          subprocess.run([sys.executable, '-m', 'pip', 'install', str(wheel)], check=True)
          script = Path(os.environ['RUNNER_TEMP']) / 'codaro-package-smoke.py'
          shutil.copyfile('scripts/package_smoke.py', script)
          subprocess.run([sys.executable, str(script)], cwd=script.parent, check=True)
