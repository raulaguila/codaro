name: Install ripgrep
description: Install the CLI dependency on supported runners
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ripgrep
    - if: runner.os == 'macOS'
      shell: bash
      run: |
        if ! command -v rg >/dev/null; then brew install ripgrep; fi
    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (-not (Get-Command rg -ErrorAction SilentlyContinue)) {
          choco install ripgrep -y --no-progress
          $env:ChocolateyInstall + '\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        }
