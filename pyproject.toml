[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "codaro"
version = "0.1.0"
description = "A source-grounded terminal assistant for exploring local repositories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "textual>=6.12,<7",
  "httpx>=0.28,<1",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-python>=0.25,<0.26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
tokenizer = ["tiktoken>=0.8,<1"]

[project.scripts]
codaro = "codaro.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/codaro"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
