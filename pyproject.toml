[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codaro"
version = "0.1.1"
description = "A terminal development agent with BYOK, bounded context and reviewed changes."
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Raul del Aguila"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "textual>=6.12,<7",
  "httpx>=0.28,<1",
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-language-pack==0.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=7,<8", "ruff>=0.11,<1"]
tokenizer = ["tiktoken>=0.8,<1"]
semantic = ["fastembed>=0.7,<0.8"]

[project.scripts]
codaro = "codaro.cli:app"

[project.urls]
Repository = "https://github.com/raulaguila/codaro"
Issues = "https://github.com/raulaguila/codaro/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/codaro"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/evaluations", "/docs/*.md", "/examples/demo/auth.py", "/examples/plugins/math.py", "/README.md", "/SECURITY.md", "/LICENSE", "/pyproject.toml", "/requirements-dev.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: optional model requests against an explicitly selected provider"]

[tool.coverage.run]
source = ["codaro"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
